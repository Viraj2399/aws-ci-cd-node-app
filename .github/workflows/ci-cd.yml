name: CI/CD Node.js AWS

on:
  push:
    branches:
      - main

jobs:

  # ── Job 1: CI (Build + Test + Lint)
  ci:
    runs-on: ubuntu-latest

    steps:
      # ── Phase 1: Checkout code
      - name: Checkout Repository
        uses: actions/checkout@v3

      # ── Phase 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # ── Phase 3: Install Dependencies
      - name: Install Dependencies
        run: npm install

      # ── Phase 4: Run Lint & Unit Tests in Parallel
      - name: Lint & Test
        run: |
          npm run lint &
          npm test &
          wait

  # ── Job 2: Deployment (only runs if CI passes)
  deploy:
    runs-on: ubuntu-latest
    needs: ci  # Ensure deployment runs only if CI job succeeds

    steps:
      # ── Checkout code (again for deploy)
      - name: Checkout Repository
        uses: actions/checkout@v3

      # ── Deploy to EC2 via SSH
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.7
        with:
            host: ${{ secrets.EC2_HOST }}
            username: ${{ secrets.EC2_USER }}
            key: ${{ secrets.EC2_SSH_KEY }}
            script: |
              echo "Starting deployment..."
              # 1️⃣ Ensure folder exists
              mkdir -p /home/ubuntu/aws-ci-cd-node-app
              cd /home/ubuntu/aws-ci-cd-node-app

              # 2️⃣ If repo not cloned yet, clone it
              if [ ! -d ".git" ]; then
                git clone https://github.com/Viraj2399/aws-ci-cd-node-app.git .
              else
                git reset --hard
                git pull origin main
              fi

              # 3️⃣ Install dependencies
              npm install --production

              # 4️⃣ Start / restart app with PM2
              pm2 restart app || pm2 start src/index.js --name app
              pm2 save

              # 5️⃣ Reload Nginx
              sudo systemctl reload nginx

              echo "Deployment complete!"

